name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore OSRSIdle/OSRSIdle.csproj

      - name: Prepare signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw 'ANDROID_KEYSTORE_BASE64 is not configured.'
          }
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\scaperunner-upload.jks",
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Build signed APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}\scaperunner-upload.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $required = @{
            ANDROID_KEY_ALIAS = $env:ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD = $env:ANDROID_KEY_PASSWORD
            ANDROID_KEYSTORE_PASSWORD = $env:ANDROID_KEYSTORE_PASSWORD
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "$($entry.Key) is not configured."
            }
          }

          keytool -list -keystore "$env:ANDROID_KEYSTORE_PATH" `
            -storetype PKCS12 `
            -storepass "$env:ANDROID_KEYSTORE_PASSWORD" `
            -alias "$env:ANDROID_KEY_ALIAS" `
            -noprompt

          dotnet publish OSRSIdle/OSRSIdle.csproj `
            --configuration Release `
            --framework net10.0-android `
            --property:AndroidPackageFormat=apk `
            --property:AndroidKeyStore=true `
            --property:AndroidSigningKeyStore="$env:ANDROID_KEYSTORE_PATH" `
            --property:AndroidSigningStoreType=pkcs12 `
            --property:AndroidSigningKeyAlias="$env:ANDROID_KEY_ALIAS" `
            --property:AndroidSigningKeyPass="$env:ANDROID_KEY_PASSWORD" `
            --property:AndroidSigningStorePass="$env:ANDROID_KEYSTORE_PASSWORD"

      - name: Find APK
        id: apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem OSRSIdle/bin/Release/net10.0-android/publish -Filter '*-Signed.apk' -File | Select-Object -First 1
          if (-not $apk) { throw 'Signed APK was not produced.' }
          "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          "name=ScapeRunner-test-${env:GITHUB_RUN_NUMBER}.apk" >> $env:GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScapeRunner-test-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create downloadable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          $tag = "test-build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          Copy-Item $env:APK_PATH (Join-Path $env:RUNNER_TEMP $env:APK_NAME)
          gh release create $tag (Join-Path $env:RUNNER_TEMP $env:APK_NAME) `
            --repo $env:GITHUB_REPOSITORY `
            --title "ScapeRunner test build $env:GITHUB_RUN_NUMBER" `
            --notes "Built from commit $env:GITHUB_SHA. Download the APK below and install it on your Android phone."
