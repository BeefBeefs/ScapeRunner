name: Export web assets

on:
  push:
    branches: [web-asset-export]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-asset-export
      - name: Ensure sprite export exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f web-export/manifest.txt ]; then
            rm -rf web-export
            mkdir -p web-export
            tar -czf /tmp/web-sprites.tar.gz -C OSRSIdle/Resources/Images Enemies Items
            base64 -w0 /tmp/web-sprites.tar.gz > /tmp/web-sprites.tar.gz.b64
            split -b 350000 -d -a 3 /tmp/web-sprites.tar.gz.b64 web-export/chunk_
            printf 'archive=web-sprites.tar.gz\nchunks=%s\nbytes=%s\n' "$(find web-export -name 'chunk_*' | wc -l)" "$(wc -c < /tmp/web-sprites.tar.gz.b64)" > web-export/manifest.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web-export
            git commit -m "Export web sprite archive"
            git push origin HEAD:web-asset-export
          fi
      - name: Reconstruct sprite archive
        shell: bash
        run: |
          set -euo pipefail
          cat web-export/chunk_* | base64 -d > /tmp/web-sprites.tar.gz
          tar -tzf /tmp/web-sprites.tar.gz >/dev/null
      - name: Upload sprite archive
        uses: actions/upload-artifact@v4
        with:
          name: web-sprites
          path: /tmp/web-sprites.tar.gz
          compression-level: 0
          retention-days: 1
