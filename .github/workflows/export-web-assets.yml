name: Export web assets

on:
  push:
    branches: [web-asset-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: web-asset-export
      - name: Package skill sprites
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/web-skills.tar.gz -C OSRSIdle/Resources/Images Skills
          tar -tzf /tmp/web-skills.tar.gz
      - name: Upload skill sprite archive
        uses: actions/upload-artifact@v4
        with:
          name: web-skill-sprites
          path: /tmp/web-skills.tar.gz
          compression-level: 0
          retention-days: 1
